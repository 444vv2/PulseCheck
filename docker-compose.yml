services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsecheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsecheck
      POSTGRES_USER: pulsecheck
      POSTGRES_PASSWORD: pulsecheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsecheck -d pulsecheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsecheck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pulsecheck-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pulsecheck
      RABBITMQ_DEFAULT_PASS: pulsecheck
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: pulsecheck-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    container_name: pulsecheck-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 10

# Потім написати для вебу і сервісів, які будуть використовувати ці бази даних.

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:
