services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsecheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsecheck
      POSTGRES_USER: pulsecheck
      POSTGRES_PASSWORD: pulsecheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsecheck -d pulsecheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsecheck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pulsecheck-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pulsecheck
      RABBITMQ_DEFAULT_PASS: pulsecheck
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: pulsecheck-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    container_name: pulsecheck-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pulsecheck-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulsecheck:pulsecheck@postgres:5432/pulsecheck?schema=public
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RABBITMQ_URI: amqp://pulsecheck:pulsecheck@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongodb:27017/pulsecheck
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: pulsecheck-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  notifier:
    build:
      context: .
      dockerfile: apps/notifier/Dockerfile
    container_name: pulsecheck-notifier
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulsecheck:pulsecheck@postgres:5432/pulsecheck?schema=public
      RABBITMQ_URI: amqp://pulsecheck:pulsecheck@rabbitmq:5672
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: "PulseCheck <alerts@pulsecheck.dev>"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: pulsecheck-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulsecheck:pulsecheck@postgres:5432/pulsecheck?schema=public
      RABBITMQ_URI: amqp://pulsecheck:pulsecheck@rabbitmq:5672
      MONGODB_URI: mongodb://mongodb:27017/pulsecheck
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:
